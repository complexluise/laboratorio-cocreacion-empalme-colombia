name: ci
# Gate por bucle de control: contrato de datos + pipeline, y la web (tipos, tests, fronteras, build).
on:
  pull_request: { branches: [main, dev] }
  push: { branches: [main, dev] }
permissions: { contents: read }
jobs:
  contrato-y-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --no-project python -m py_compile extraccion/*.py scripts/*.py
      - run: uv run scripts/validar_contrato.py # schemas + dataset de la web conforme al contrato

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint:boundaries # las fronteras: falla si un import cruza ilegalmente
      - run: pnpm build
