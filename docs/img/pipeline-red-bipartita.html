<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slide 16:9 · Cómo se arma la red bipartita (TRAMA)</title>
<style>
  html,body{margin:0;padding:0;background:transparent;overflow:hidden;}
  svg{display:block;width:100vw;height:100vh;}
</style>
</head>
<body>
  <svg viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid meet"
       xmlns="http://www.w3.org/2000/svg" role="img"
       aria-label="Diagrama 16:9 del pipeline. Inicio arriba: 1 Descargar del DNP baja a 2 Pasar a texto con OCR de Gemini. Fila central: 2 a 3 Leer con IA (v1 Gemini legado reemplazado por v2 agentes de Claude) a 4 Curar áreas a 5 Publicar y validar. Final abajo: 5 baja a 6 Usar la red. Retroalimentaciones: revisión adversarial con correcciones hacia el paso 3; la validación que corrige y revalida hacia 4; y las bitácoras que vuelven a la curaduría 4.">
    <defs>
      <style>
        .h1{font:800 46px ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;fill:#1a2230;letter-spacing:-.5px;}
        .h2{font:400 21px ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;fill:#5b6472;}
        .leg{font:600 16px ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;fill:#5b6472;}
        .btitle{font:700 19px ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;fill:#1a2230;}
        .bscript{font:500 13px ui-monospace,Consolas,Menlo,monospace;fill:#5b6472;}
        .bnum{font:800 18px ui-sans-serif,system-ui,"Segoe UI",sans-serif;fill:#fff;}
        .step{font:700 16px ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;fill:#2b4c86;}
        .vtitle{font:700 13.5px ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;}
        .vscript{font:500 12px ui-monospace,Consolas,Menlo,monospace;fill:#5b6472;}
        .edge{font:600 11.5px ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;fill:#5b6472;}
        .fb{font:700 16px ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;fill:#b15a34;}
        .fbm{font:500 13px ui-monospace,Consolas,Menlo,monospace;fill:#b15a34;}
        .note{font:600 16px ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;fill:#1a2230;}
        .notes{font:400 13px ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;fill:#8a92a0;}
        .muted{fill:#5b6472;}
      </style>
      <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#1a2230" flood-opacity="0.12"/>
      </filter>
      <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#9aa2b0"/>
      </marker>
      <marker id="fbarr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#b15a34"/>
      </marker>
    </defs>

    <!-- ===== TOP BAND ===== -->
    <rect x="64" y="52" width="60" height="5" rx="2.5" fill="#2b4c86"/>
    <text class="h1" x="64" y="104">Cómo se arma la red bipartita de políticas e instrumentos</text>
    <text class="h2" x="66" y="142">Del informe de empalme del DNP al mapa navegable · sector Ciencia, Tecnología e Innovación</text>

    <g transform="translate(66,178)">
      <line x1="0" y1="0" x2="26" y2="0" stroke="#8a92a0" stroke-width="3"/>
      <text class="leg" x="34" y="5">avance del flujo</text>
      <line x1="196" y1="0" x2="222" y2="0" stroke="#b15a34" stroke-width="3" stroke-dasharray="6 4"/>
      <text class="leg" x="230" y="5">retroalimentación</text>
      <rect x="408" y="-8" width="15" height="15" rx="3" fill="#8a92a0"/>
      <text class="leg" x="430" y="5">automático</text>
      <rect x="548" y="-8" width="15" height="15" rx="3" fill="#2b4c86"/>
      <text class="leg" x="570" y="5">IA</text>
      <rect x="608" y="-8" width="15" height="15" rx="3" fill="#3e7c5a"/>
      <text class="leg" x="630" y="5">equipo</text>
      <rect x="710" y="-8" width="15" height="15" rx="3" fill="#b15a34"/>
      <text class="leg" x="732" y="5">producto / feedback</text>
    </g>
    <line x1="64" y1="206" x2="1856" y2="206" stroke="#e2e5ea" stroke-width="1.5"/>

    <!-- ===== FORWARD EDGES (grey) ===== -->
    <g stroke="#9aa2b0" stroke-width="2.5" fill="none" marker-end="url(#arr)">
      <line x1="395"  y1="420" x2="395"  y2="462"/>   <!-- 1 baja a 2 -->
      <line x1="530"  y1="540" x2="610"  y2="540"/>   <!-- 2 -> 3 -->
      <line x1="910"  y1="540" x2="990"  y2="540"/>   <!-- 3 -> 4 -->
      <line x1="1240" y1="540" x2="1350" y2="540"/>   <!-- 4 -> 5 -->
      <line x1="1475" y1="615" x2="1475" y2="688"/>   <!-- 5 baja a 6 -->
    </g>
    <g class="edge">
      <text x="408" y="447">PDF+anexos</text>
      <text x="570" y="528" text-anchor="middle">markdown</text>
      <text x="950" y="528" text-anchor="middle">la red</text>
      <text x="1295" y="528" text-anchor="middle">con áreas</text>
      <text x="1488" y="662">dataset</text>
    </g>

    <!-- ===== FEEDBACK EDGES (terracotta, dashed) ===== -->
    <g stroke="#b15a34" stroke-width="2.5" fill="none" stroke-dasharray="7 5" marker-end="url(#fbarr)">
      <path d="M760,388 L760,436"/>                                <!-- revisión -> grupo 3 -->
      <path d="M1400,615 C 1360,672 1250,702 1130,617"/>          <!-- validación NO -> curar áreas -->
      <path d="M1350,760 C 1210,760 1150,682 1095,619"/>          <!-- bitácoras -> curar áreas -->
    </g>

    <!-- ===== REVISIÓN callout ===== -->
    <g>
      <rect x="615" y="292" width="290" height="96" rx="10" fill="#fff" stroke="#b15a34" stroke-dasharray="6 4" filter="url(#sh)"/>
      <text class="fb" x="639" y="332">Revisión adversarial (agentes)</text>
      <text class="fbm" x="639" y="362" font-size="14">&#8594; correcciones.yaml, narrativa.json</text>
    </g>

    <!-- ===== BLOCK 1 (inicio, encima del 2) ===== -->
    <g>
      <rect x="260" y="280" width="270" height="140" rx="14" fill="#fff" stroke="#d9dde4" filter="url(#sh)"/>
      <rect x="260" y="280" width="6" height="140" rx="3" fill="#8a92a0"/>
      <circle cx="260" cy="350" r="20" fill="#8a92a0"/>
      <text class="bnum" x="260" y="357" text-anchor="middle">1</text>
      <text class="btitle" x="296" y="343">Descargar del DNP</text>
      <text class="bscript" x="296" y="373">empalme_scraper.py</text>
    </g>

    <!-- ===== BLOCK 2 ===== -->
    <g>
      <rect x="260" y="465" width="270" height="150" rx="14" fill="#fff" stroke="#d9dde4" filter="url(#sh)"/>
      <rect x="260" y="465" width="6" height="150" rx="3" fill="#2b4c86"/>
      <circle cx="260" cy="540" r="20" fill="#2b4c86"/>
      <text class="bnum" x="260" y="547" text-anchor="middle">2</text>
      <text class="btitle" x="296" y="520">Pasar a texto (+OCR)</text>
      <text class="bscript" x="296" y="548">empalme_to_markdown.py</text>
      <text class="bscript" x="296" y="568">+ ocr_gemini.py · Gemini</text>
    </g>

    <!-- ===== BLOCK 3 · GROUP ===== -->
    <g>
      <rect x="610" y="440" width="300" height="200" rx="16" fill="#f7f8fa" stroke="#d3d8e0"/>
      <text class="step" x="632" y="470">3 · Leer con IA y armar la red</text>

      <rect x="632" y="484" width="256" height="50" rx="9" fill="#fff" stroke="#b6bcc7" stroke-dasharray="5 4"/>
      <text class="vtitle muted" x="646" y="506">v1 · Gemini por API <tspan font-weight="500" font-size="11.5" fill="#8a92a0">(legado)</tspan></text>
      <text class="vscript" x="646" y="524">extraer_instrumentos.py</text>

      <text class="fb" x="760" y="563" text-anchor="middle" font-size="12">reemplaza · cuota + red desconectada</text>

      <rect x="632" y="580" width="256" height="50" rx="9" fill="#fff" stroke="#2b4c86" stroke-width="1.8"/>
      <text class="vtitle" x="646" y="602" fill="#2b4c86">v2 · Agentes de Claude <tspan font-weight="500" font-size="11.5" fill="#7a8290">(vigente)</tspan></text>
      <text class="vscript" x="646" y="620" font-size="12">rebuild-ctei-claude.workflow.js</text>
    </g>

    <!-- ===== BLOCK 4 ===== -->
    <g>
      <rect x="990" y="465" width="250" height="150" rx="14" fill="#fff" stroke="#d9dde4" filter="url(#sh)"/>
      <rect x="990" y="465" width="6" height="150" rx="3" fill="#3e7c5a"/>
      <circle cx="990" cy="540" r="20" fill="#3e7c5a"/>
      <text class="bnum" x="990" y="547" text-anchor="middle">4</text>
      <text class="btitle" x="1026" y="533">Curar las áreas</text>
      <text class="bscript" x="1026" y="563">aplicar_areas.py · equipo</text>
    </g>

    <!-- ===== BLOCK 5 ===== -->
    <g>
      <rect x="1350" y="465" width="250" height="150" rx="14" fill="#fff" stroke="#d9dde4" filter="url(#sh)"/>
      <rect x="1350" y="465" width="6" height="150" rx="3" fill="#8a92a0"/>
      <circle cx="1350" cy="540" r="20" fill="#8a92a0"/>
      <text class="bnum" x="1350" y="547" text-anchor="middle">5</text>
      <text class="btitle" x="1386" y="533">Publicar y validar</text>
      <text class="bscript" x="1386" y="563">generar_web.py · contrato</text>
    </g>

    <!-- ===== BLOCK 6 (final, debajo del 5) ===== -->
    <g>
      <rect x="1350" y="690" width="250" height="140" rx="14" fill="#fff" stroke="#d9dde4" filter="url(#sh)"/>
      <rect x="1350" y="690" width="6" height="140" rx="3" fill="#b15a34"/>
      <circle cx="1350" cy="760" r="20" fill="#b15a34"/>
      <text class="bnum" x="1350" y="767" text-anchor="middle">6</text>
      <text class="btitle" x="1386" y="753">Usar la red</text>
      <text class="bscript" x="1386" y="783" font-family="ui-sans-serif,system-ui,'Segoe UI',sans-serif">sitio · Excel · bitácoras</text>
    </g>

    <!-- ===== FEEDBACK labels (en zonas libres, sin fondo) ===== -->
    <text class="fb" x="1220" y="686" text-anchor="middle">no · corregir y revalidar</text>
    <text class="fb" x="1180" y="800" text-anchor="middle">las bitácoras vuelven a la curaduría</text>
    <text x="1180" y="822" text-anchor="middle" font-family="ui-sans-serif,system-ui,'Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#b98a6f">(revisión humana prevista — hoy no existe)</text>

    <!-- ===== BOTTOM NOTES ===== -->
    <line x1="64" y1="964" x2="1856" y2="964" stroke="#e2e5ea" stroke-width="1.5"/>
    <text class="note" x="64" y="1000">La red publicada la arman los agentes de Claude (v2); Gemini solo transcribe los documentos escaneados.</text>
    <text class="notes" x="64" y="1026">La revisión adversarial se hizo sobre la v1 y no se reaplicó a la red vigente; la revisión humana vía bitácoras está prevista. Fuente: docs/pipeline-extraccion.md</text>
  </svg>
</body>
</html>
