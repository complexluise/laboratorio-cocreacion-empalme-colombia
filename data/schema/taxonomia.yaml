# Vocabularios controlados del laboratorio — capa de análisis del mapa
# ---------------------------------------------------------------------------
# Fuente ÚNICA de verdad de los valores permitidos, alineada con
# docs/encuadre-actividad-trama.md y docs/teoria-politica.md. Los scripts
# (extraer_instrumentos.py) leen de aquí. Versionar los cambios de vocabulario.
#
# El nodo del mapa es un INSTRUMENTO DE POLÍTICA PÚBLICA (Hood 1983; Lascoumes &
# Le Galès 2004) o un OBJETIVO DE POLÍTICA. Los instrumentos se agrupan por
# POLÍTICA PÚBLICA y se leen entre dos gobiernos con la tipología de cambio
# institucional gradual (Mahoney & Thelen 2010).
#
# NOTA: la capa de "ideas" facetadas (tema A–K, etc.) quedó DEPRECADA; ver
# data/schema/idea.schema.json.

version: 2

objetos:

  # Tipo de instrumento según el recurso que moviliza el Estado (NATO, Hood 1983).
  # Solo aplica a instrumentos; un objetivo de política (es_objetivo) no lleva tipo_nato.
  tipo_nato:                  # Cardinalidad: 1.
    cardinalidad: uno
    valores:
      nodalidad:    "Información: datos, comunicación, orientación (p. ej. un sistema de información)."
      autoridad:    "Normas y obligaciones (p. ej. una ley o un decreto)."
      tesoro:       "Dinero (p. ej. un fondo o una convocatoria)."
      organizacion: "Capacidad directa del Estado (p. ej. un programa ejecutado por una entidad)."

  # Modo de cambio del instrumento entre los dos gobiernos (Mahoney & Thelen 2010; + deriva).
  # Derivado en parte de 'presencia' (ver extraer_instrumentos.py):
  #  - solo 2018-2022 -> terminacion ; solo 2022-2026 -> estratificacion (deterministas).
  #  - presente en ambas -> continuidad-estable / conversion / reversion / deriva (semántico).
  modo_cambio:                # Cardinalidad: 1.
    cardinalidad: uno
    valores:
      continuidad-estable: "Mismo instrumento, mismo modo. Persiste (dependencia de la trayectoria)."
      conversion:          "Mismo instrumento, redesplegado hacia otro uso o modo."
      estratificacion:     "Instrumento presente solo en el gobierno posterior (se suma)."
      terminacion:         "Instrumento presente solo en el gobierno anterior (se deja o se reemplaza)."
      reversion:           "Persiste pero invierte su rumbo o signo."
      deriva:              "Persiste formalmente, pero su efecto cambia con el entorno."

  # Cómo se manifestó el instrumento en una vigencia (modo de la 'presencia').
  modo_presencia:             # Cardinalidad: 1.
    cardinalidad: uno
    valores:
      propuesto: "Anunciado o planeado, sin ejecución reportada."
      logrado:   "Ejecutado, con resultado reportado (idealmente con cifra)."
      pendiente: "Inconcluso, en riesgo, o recomendado al gobierno entrante."

  # Confianza del grupo/extracción en la clasificación del instrumento (formato del encuadre §6).
  confianza:                  # Cardinalidad: 1.
    cardinalidad: uno
    valores:
      alta:  "Evidencia clara y suficiente."
      media: "Evidencia parcial o interpretación razonable."
      baja:  "Indicio débil; verificar contra el documento."

  # Aristas dirigidas entre instrumentos DISTINTOS.
  relaciones:
    habilita:   "Una norma o instrumento da existencia o soporte legal a otro (Ley 2162 -> SNCTI)."
    financia:   "Una fuente de financiación costea otro instrumento (SGR/FCTeI -> Fondo Francisco José de Caldas)."
    depende-de: "Precedencia o condición entre instrumentos."
    encadena:   "Sinergia: dos instrumentos se encadenan o potencian mutuamente (Misión de Sabios -> PIIOM)."
