# Áreas de política pública (issue #20) — CURADURÍA del equipo, versionada.
#
# Una POLÍTICA es un ÁREA persistente (problema/área que atraviesa gobiernos). Cada gobierno le
# declara su objetivo (uno o varios enunciados, tomados tal cual de las políticas que el pipeline
# extrajo de su informe de empalme). `declaradas` lista los ids de esas políticas de origen.
#
# cambio_objetivo (vocabulario en data/schema/taxonomia.yaml):
#   se-mantiene · se-reformula · no-declarado · nuevo
# "no-declarado" (no "abandonado"): el informe lo escribe cada gobierno; el silencio no prueba abandono.
#
# Criterios acordados con el PO: cada MISIÓN es un área; apropiación social y ciencia abierta son
# áreas distintas; las áreas las define el equipo antes de publicar (ampliable al seminario).
# Lo aplica, de forma determinista, extraccion/aplicar_areas.py.

